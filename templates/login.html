<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — نظام محاسبة المقاولات</title>
  <script>document.documentElement.dataset.theme='dark'</script>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo-circle">م</div>
    <h1>نظام محاسبة المقاولات</h1>
    <div class="sub">{{ company_name }}</div>
    {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" name="username" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-gold btn-block" type="submit">دخول</button>
    </form>
    
    <div class="hint" style="margin-top:6px;text-align:center;font-size:12px;opacity:.7">© جميع الحقوق محفوظة — المحاسب / أحمد عبدالله</div>
  </div>
</div>

</body>
</html>
